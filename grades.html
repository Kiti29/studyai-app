<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyAI — Grades</title>
  <style>
    :root {
      --navy:#06111F; --navy2:#0D1B2A; --navy3:#112539;
      --teal:#06B6D4; --gray:#94A3B8; --white:#FFFFFF;
      --border:rgba(6,182,212,0.15); --amber:#F59E0B;
      --green:#10B981; --indigo:#6366F1; --red:#EF4444;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--navy); color:var(--white); font-family:Arial,sans-serif; display:flex; min-height:100vh; }

    .sidebar { width:240px; background:var(--navy2); border-right:1px solid var(--border); padding:28px 20px; display:flex; flex-direction:column; gap:8px; position:fixed; top:0; bottom:0; }
    .logo { font-size:22px; font-weight:800; color:var(--teal); margin-bottom:32px; padding-left:12px; }
    .nav-item { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:10px; cursor:pointer; font-size:14px; color:var(--gray); transition:all 0.2s; text-decoration:none; }
    .nav-item:hover { background:var(--navy3); color:var(--white); }
    .nav-item.active { background:rgba(6,182,212,0.12); color:var(--teal); }
    .nav-icon { font-size:18px; width:24px; text-align:center; }

    .main { margin-left:240px; flex:1; padding:36px 40px; }
    .page-title { font-size:26px; font-weight:700; margin-bottom:4px; }
    .page-sub { font-size:14px; color:var(--gray); margin-bottom:32px; }

    /* GPA BANNER */
    .gpa-row { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:32px; }
    .gpa-card { background:var(--navy2); border:1px solid var(--border); border-radius:14px; padding:22px 24px; }
    .gpa-label { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--gray); margin-bottom:8px; }
    .gpa-val { font-size:32px; font-weight:800; }
    .gpa-trend { font-size:12px; margin-top:4px; }

    /* SUBJECTS TABLE */
    .section-title { font-size:16px; font-weight:700; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; }
    .add-btn { background:var(--teal); color:#fff; border:none; padding:8px 18px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; }

    .subject-card { background:var(--navy2); border:1px solid var(--border); border-radius:14px; padding:20px 24px; margin-bottom:12px; }
    .subj-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
    .subj-name { font-size:15px; font-weight:700; }
    .subj-code { font-size:12px; color:var(--gray); margin-top:2px; }
    .grade-pill { font-size:13px; font-weight:700; padding:5px 14px; border-radius:50px; }
    .grade-a  { background:rgba(16,185,129,.15); color:var(--green); }
    .grade-b  { background:rgba(6,182,212,.15); color:var(--teal); }
    .grade-c  { background:rgba(245,158,11,.15); color:var(--amber); }
    .grade-d  { background:rgba(239,68,68,.15); color:var(--red); }

    .assess-row { display:flex; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.04); }
    .assess-row:last-child { border-bottom:none; }
    .assess-name { flex:1; font-size:13px; color:var(--gray); }
    .assess-weight { font-size:12px; color:var(--gray); width:48px; text-align:right; }
    .assess-grade { font-size:13px; font-weight:600; width:48px; text-align:right; color:var(--white); }
    .bar-wrap { width:120px; height:6px; background:var(--navy3); border-radius:50px; overflow:hidden; }
    .bar-fill { height:100%; border-radius:50px; background:linear-gradient(90deg,var(--teal),var(--indigo)); }

    /* ADD GRADE MODAL */
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:999; justify-content:center; align-items:center; }
    .modal.open { display:flex; }
    .modal-box { background:var(--navy2); border:1px solid rgba(6,182,212,.25); border-radius:20px; padding:36px; width:420px; }
    .modal-box h2 { font-size:18px; font-weight:700; margin-bottom:20px; }
    .field { margin-bottom:14px; }
    .field label { font-size:12px; color:var(--gray); display:block; margin-bottom:5px; }
    .field input, .field select { width:100%; padding:11px 14px; border-radius:9px; border:1px solid rgba(6,182,212,.2); background:var(--navy); color:var(--white); font-size:14px; outline:none; }
    .field select option { background:var(--navy2); }
    .btn-row { display:flex; gap:10px; margin-top:20px; }
    .btn-add { flex:1; padding:12px; background:var(--teal); color:#fff; border:none; border-radius:9px; font-size:14px; font-weight:600; cursor:pointer; }
    .btn-cancel { flex:1; padding:12px; background:transparent; color:var(--gray); border:1px solid rgba(255,255,255,.1); border-radius:9px; font-size:14px; cursor:pointer; }

    .ai-tip { background:linear-gradient(135deg,rgba(6,182,212,.07),rgba(99,102,241,.09)); border:1px solid rgba(6,182,212,.2); border-radius:12px; padding:16px 20px; margin-top:8px; font-size:14px; color:var(--gray); line-height:1.65; }
    .ai-tip .tag { font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--teal); margin-bottom:5px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared.js"></script>
</head>
<body>

  <aside class="sidebar">
    <div class="logo">StudyAI</div>
    <a href="/dashboard.html" class="nav-item"><span class="nav-icon">📊</span> Dashboard</a>
    <a href="/assignments.html" class="nav-item"><span class="nav-icon">📋</span> Assignments</a>
    <a href="/planner.html" class="nav-item"><span class="nav-icon">📅</span> Study Planner</a>
    <a href="/tutor.html" class="nav-item"><span class="nav-icon">💬</span> AI Tutor</a>
    <a href="/grades.html" class="nav-item active"><span class="nav-icon">📈</span> Grades</a>
    <a href="#" class="nav-item"><span class="nav-icon">⚙️</span> Settings</a>
  </aside>

  <main class="main">
    <div class="page-title">Grades</div>
    <div class="page-sub">Track every assessment, watch your GPA climb.</div>

    <div class="gpa-row">
      <div class="gpa-card">
        <div class="gpa-label">Current GPA</div>
        <div class="gpa-val" style="color:var(--teal)" id="currentGPA">—</div>
        <div class="gpa-trend" style="color:var(--green)" id="gpaTrend">—</div>
      </div>
      <div class="gpa-card">
        <div class="gpa-label">Best Subject</div>
        <div class="gpa-val" style="color:var(--green);font-size:18px;margin-top:6px" id="bestSubj">—</div>
      </div>
      <div class="gpa-card">
        <div class="gpa-label">Needs Attention</div>
        <div class="gpa-val" style="color:var(--amber);font-size:18px;margin-top:6px" id="worstSubj">—</div>
      </div>
      <div class="gpa-card">
        <div class="gpa-label">Assessments Logged</div>
        <div class="gpa-val" style="color:var(--indigo)" id="totalAssess">—</div>
      </div>
    </div>

    <div class="section-title">
      Subject Breakdown
      <button class="add-btn" onclick="openModal()">+ Log Grade</button>
    </div>

    <div id="subjectList"></div>

    <div class="ai-tip">
      <div class="tag">⚡ AI Study Coach</div>
      <span id="aiComment">Loading your grade analysis...</span>
    </div>
  </main>

  <!-- MODAL -->
  <div class="modal" id="modal">
    <div class="modal-box">
      <h2>Log a Grade</h2>
      <div class="field">
        <label>Subject</label>
        <select id="mSubject">
          <option value="ACC101">ACC101 — Accounting</option>
          <option value="HIST201">HIST201 — History</option>
          <option value="RES101">RES101 — Research Methods</option>
          <option value="ITC204">ITC204 — IT Project</option>
        </select>
      </div>
      <div class="field">
        <label>Assessment name</label>
        <input type="text" id="mName" placeholder="e.g. Mid-semester quiz">
      </div>
      <div class="field">
        <label>Grade (%)</label>
        <input type="number" id="mGrade" min="0" max="100" placeholder="e.g. 78">
      </div>
      <div class="field">
        <label>Weight (%)</label>
        <input type="number" id="mWeight" min="1" max="100" placeholder="e.g. 20">
      </div>
      <div class="btn-row">
        <button class="btn-add" onclick="logGrade()">Save Grade</button>
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const SUBJECT_NAMES = {
      ACC101: 'Accounting Fundamentals',
      HIST201: 'Modern History',
      RES101: 'Research Methods',
      ITC204: 'IT Project Management',
    };

    let grades = JSON.parse(localStorage.getItem('grades') || 'null');

    if (!grades) {
      grades = {
        ACC101: [
          { name:'Week 3 Quiz', grade:72, weight:10 },
          { name:'Mid-Sem Test', grade:68, weight:25 },
        ],
        HIST201: [
          { name:'Essay 1', grade:81, weight:30 },
          { name:'Quiz', grade:76, weight:15 },
        ],
        RES101: [
          { name:'Reflection 1', grade:85, weight:20 },
        ],
        ITC204: [
          { name:'Project Proposal', grade:90, weight:20 },
          { name:'Presentation', grade:88, weight:15 },
        ],
      };
      localStorage.setItem('grades', JSON.stringify(grades));
    }

    function weightedAvg(items) {
      const totalWeight = items.reduce((s,i) => s + i.weight, 0);
      if (!totalWeight) return 0;
      return items.reduce((s,i) => s + i.grade * i.weight, 0) / totalWeight;
    }

    function pctToGrade(pct) {
      if (pct >= 85) return { label:'HD', cls:'grade-a' };
      if (pct >= 75) return { label:'D',  cls:'grade-b' };
      if (pct >= 65) return { label:'C',  cls:'grade-b' };
      if (pct >= 50) return { label:'P',  cls:'grade-c' };
      return { label:'F', cls:'grade-d' };
    }

    function pctToGPA(pct) {
      if (pct >= 85) return 7;
      if (pct >= 75) return 6;
      if (pct >= 65) return 5;
      if (pct >= 50) return 4;
      return 2;
    }

    function render() {
      const list = document.getElementById('subjectList');
      list.innerHTML = '';

      const gpas = [];
      let bestName = '', bestScore = 0, worstName = '', worstScore = 101;
      let totalAssessments = 0;

      Object.entries(grades).forEach(([code, items]) => {
        if (!items.length) return;
        totalAssessments += items.length;
        const avg = weightedAvg(items);
        const { label, cls } = pctToGrade(avg);
        const gpa = pctToGPA(avg);
        gpas.push(gpa);

        if (avg > bestScore) { bestScore = avg; bestName = code; }
        if (avg < worstScore) { worstScore = avg; worstName = code; }

        const card = document.createElement('div');
        card.className = 'subject-card';
        card.innerHTML = `
          <div class="subj-top">
            <div>
              <div class="subj-name">${SUBJECT_NAMES[code] || code}</div>
              <div class="subj-code">${code} · ${items.length} assessment${items.length>1?'s':''} logged · Avg ${avg.toFixed(1)}%</div>
            </div>
            <span class="grade-pill ${cls}">${label} · ${avg.toFixed(0)}%</span>
          </div>
          ${items.map(item => `
            <div class="assess-row">
              <span class="assess-name">${item.name}</span>
              <div class="bar-wrap"><div class="bar-fill" style="width:${item.grade}%"></div></div>
              <span class="assess-weight">${item.weight}%</span>
              <span class="assess-grade">${item.grade}%</span>
            </div>
          `).join('')}
        `;
        list.appendChild(card);
      });

      // Stats
      const overallGPA = gpas.length ? (gpas.reduce((a,b)=>a+b,0)/gpas.length).toFixed(1) : '—';
      document.getElementById('currentGPA').textContent = overallGPA;
      document.getElementById('gpaTrend').textContent = overallGPA >= 6 ? '↑ Up from last semester' : '→ Keep pushing';
      document.getElementById('bestSubj').textContent = bestName || '—';
      document.getElementById('worstSubj').textContent = worstName || '—';
      document.getElementById('totalAssess').textContent = totalAssessments;

      // AI comment
      const comments = [
        `Your strongest subject is ${bestName} — keep that consistency. ${worstName} needs more attention; consider booking an extra session with your AI tutor this week.`,
        `Overall GPA of ${overallGPA} is solid. To hit a 7.0, focus on your ${worstName} assessments — those are dragging the average down.`,
        `Good spread across subjects. Your ${bestName} work is excellent. Push ${worstName} harder over the next 2 weeks to lift your semester average.`,
      ];
      document.getElementById('aiComment').textContent = comments[Math.floor(Math.random() * comments.length)];
    }

    function openModal() {
      document.getElementById('mName').value = '';
      document.getElementById('mGrade').value = '';
      document.getElementById('mWeight').value = '';
      document.getElementById('modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
    }

    function logGrade() {
      const subject = document.getElementById('mSubject').value;
      const name = document.getElementById('mName').value.trim();
      const grade = parseFloat(document.getElementById('mGrade').value);
      const weight = parseFloat(document.getElementById('mWeight').value);
      if (!name || isNaN(grade) || isNaN(weight)) { alert('Fill in all fields.'); return; }
      if (!grades[subject]) grades[subject] = [];
      grades[subject].push({ name, grade, weight });
      localStorage.setItem('grades', JSON.stringify(grades));
      closeModal();
      render();
    }

    render();
  </script>
</body>
</html>
